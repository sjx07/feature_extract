[project]
name = "feature_extract"
version = "0.0.1"
description = "Feature extraction from prompt corpora: decomposition, library, alignment, with a GUI over one store."
requires-python = ">=3.10"
dependencies = ["openai>=1.30", "httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fx = "fx.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
